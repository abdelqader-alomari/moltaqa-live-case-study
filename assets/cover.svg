<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Moltaqa Live">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#120a26"/></linearGradient>
    <radialGradient id="a"><stop offset="0" stop-color="#e11d48" stop-opacity=".55"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/></radialGradient>
    <radialGradient id="b"><stop offset="0" stop-color="#fb7185" stop-opacity=".45"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <clipPath id="c"><rect width="1280" height="400" rx="22"/></clipPath>
    <style>.t{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .f1{animation:f1 14s ease-in-out infinite} .f2{animation:f2 17s ease-in-out infinite}
      @keyframes f1{50%{transform:translate(70px,25px)}} @keyframes f2{50%{transform:translate(-60px,-25px)}}</style>
  </defs>
  <g clip-path="url(#c)">
