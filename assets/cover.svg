    <circle class="f1" cx="200" cy="80" r="280" fill="url(#a)"/><circle class="f2" cx="1100" cy="330" r="300" fill="url(#b)"/>
    <text class="t" x="70" y="92" font-size="16" font-weight="700" letter-spacing="3" fill="#fb7185">CASE STUDY · ABDELQADER AL-OMARI</text>
    <text class="t" x="68" y="178" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#tx)">Moltaqa Live</text>
    <text class="t" x="70" y="232" font-size="24" fill="#cbd5e1">Live real-estate streaming: watch, negotiate, sell</text>
    <g transform="translate(70 300)"><rect width="89" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="44.5" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">Flutter</text></g><g transform="translate(171 300)"><rect width="98" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="49.0" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">Firebase</text></g><g transform="translate(281 300)"><rect width="107" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="53.5" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">Agora RTC</text></g><g transform="translate(400 300)"><rect width="161" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="80.5" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">Cloud Functions</text></g><g transform="translate(573 300)"><rect width="143" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="71.5" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">iOS &amp; Android</text></g>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
